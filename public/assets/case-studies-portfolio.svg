          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Mobile, Web, Desktop &amp; Cloud</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ 100% Production Success</text>
        </g>
        <g transform="translate(200, 0)">

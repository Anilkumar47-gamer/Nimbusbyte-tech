        <rect x="14" y="14" width="126" height="20" rx="4" fill="#132a48" />
        <text x="77" y="28" text-anchor="middle" fill="#6ee7c4" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">ENTERPRISE SAAS</text>
        

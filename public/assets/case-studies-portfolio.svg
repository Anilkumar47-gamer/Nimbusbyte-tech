        <rect x="14" y="174" width="232" height="28" rx="4" fill="#132742" stroke="#1e4472" />
        <text x="130" y="192" text-anchor="middle" fill="#6ee7c4" font-family="'Inter', sans-serif" font-size="10" font-weight="600">60 FPS Fluid UI Engine</text>

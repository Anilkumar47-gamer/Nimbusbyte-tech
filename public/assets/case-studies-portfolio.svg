          <text x="10" y="18" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">RAM: 650MB → 38MB</text>
          <text x="10" y="34" fill="#3fa9f5" font-family="'JetBrains Mono', monospace" font-size="10">I/O Latency: &lt; 0.8ms</text>

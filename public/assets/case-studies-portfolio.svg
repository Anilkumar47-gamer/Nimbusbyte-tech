<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="csBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e1b" />
      <stop offset="50%" stop-color="#08172c" />
      <stop offset="100%" stop-color="#0c2344" />
    </linearGradient>
    <linearGradient id="csMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fa9f5" />
      <stop offset="100%" stop-color="#6ee7c4" />
    </linearGradient>
    <filter id="csGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#csBg)" />

  <circle cx="260" cy="180" r="160" fill="#3fa9f5" opacity="0.14" filter="url(#csGlow)" />
  <circle cx="740" cy="340" r="170" fill="#6ee7c4" opacity="0.12" filter="url(#csGlow)" />

  <g transform="translate(48, 36)">
    <rect width="864" height="468" rx="14" fill="#081426" stroke="#1d3d6a" stroke-width="1.6" fill-opacity="0.95" />


        <rect x="14" y="174" width="236" height="28" rx="4" fill="#132742" stroke="#1e4472" />
        <text x="132" y="192" text-anchor="middle" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Delta Auto-Update Stream</text>
      </g>

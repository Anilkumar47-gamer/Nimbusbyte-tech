          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Automated multi-language suites</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ 100% CI Gate Protected</text>
        </g>
        <g transform="translate(410, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">41% Avg Cost Reduction</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">AWS &amp; GCP FinOps optimization</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ SLA Maintained at 99.9%+</text>
        </g>
        <g transform="translate(620, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">100% On-Time Delivery</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Two-week sprint demo cycles</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ Guaranteed Milestones</text>
        </g>

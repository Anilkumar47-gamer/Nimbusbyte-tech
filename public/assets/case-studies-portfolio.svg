        <text x="74" y="28" text-anchor="middle" fill="#7cc4f8" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">MOBILE FINTECH</text>
        
        <text x="14" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">Cross-Platform Wealth App</text>
        <text x="14" y="80" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Flutter &amp; SQLite offline engine with sub-100ms trade streaming.</text>
        
        <g transform="translate(14, 114)">
          <rect width="232" height="44" rx="6" fill="#071220" />
          <text x="10" y="18" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">Startup: 4.2s → 0.4s</text>
          <text x="10" y="34" fill="#3fa9f5" font-family="'JetBrains Mono', monospace" font-size="10">App Store Rating: 4.9★</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="carBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e1c" />
      <stop offset="50%" stop-color="#09172e" />
      <stop offset="100%" stop-color="#0d2448" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fa9f5" />
      <stop offset="100%" stop-color="#6ee7c4" />
    </linearGradient>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#carBg)" />

  <circle cx="280" cy="180" r="160" fill="#3fa9f5" opacity="0.14" filter="url(#carGlow)" />
  <circle cx="720" cy="340" r="170" fill="#6ee7c4" opacity="0.11" filter="url(#carGlow)" />

  <g transform="translate(48, 36)">
    <rect width="864" height="468" rx="14" fill="#081426" stroke="#1d3d6a" stroke-width="1.6" fill-opacity="0.95" />

    <!-- Top Bar -->
    <g transform="translate(24, 20)">
      <text y="16" fill="#6ee7c4" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">CAREERS &amp; ENGINEERING CULTURE</text>
      <text y="42" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">Remote-First Practitioners · Senior Pods · High Craftsmanship</text>
    </g>

    <!-- 3 Culture Pillars -->
    <g transform="translate(24, 76)">
      <!-- Card 1: Remote-First Autonomy -->
      <g transform="translate(0, 0)">
        <rect width="260" height="236" rx="10" fill="#0c1b33" stroke="#1c385c" />
        <circle cx="36" cy="36" r="16" fill="#3fa9f5" opacity="0.15" />
        <text x="36" y="42" text-anchor="middle" fill="#3fa9f5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">◈</text>
        <text x="18" y="80" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">Remote-First Autonomy</text>
        <text x="18" y="104" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="11">Work from anywhere in India with flexible schedules. We judge engineering output, not desk hours.</text>
        
        <rect x="18" y="180" width="224" height="32" rx="4" fill="#122744" />
        <text x="28" y="200" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ Deep Work Hours</text>
      </g>

      <!-- Card 2: Architecture Impact -->
      <g transform="translate(276, 0)">
        <rect width="260" height="236" rx="10" fill="#0c1b33" stroke="#1c385c" />
        <circle cx="36" cy="36" r="16" fill="#6ee7c4" opacity="0.15" />
        <text x="36" y="42" text-anchor="middle" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">⚙</text>
        <text x="18" y="80" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">Direct Architecture Impact</text>
        <text x="18" y="104" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="11">Small senior squads mean your name is directly on technical designs, test frameworks, and client systems.</text>
        
        <rect x="18" y="180" width="224" height="32" rx="4" fill="#122744" />
        <text x="28" y="200" fill="#7cc4f8" font-family="'JetBrains Mono', monospace" font-size="10">✓ Senior Squads Only</text>
      </g>

      <!-- Card 3: Growth & Tooling Budget -->
      <g transform="translate(552, 0)">
        <rect width="264" height="236" rx="10" fill="#0c1b33" stroke="#1c385c" />
        <circle cx="36" cy="36" r="16" fill="#a855f7" opacity="0.15" />
        <text x="36" y="42" text-anchor="middle" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">▲</text>
        <text x="18" y="80" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">Growth &amp; Tooling Stipend</text>
        <text x="18" y="104" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="11">Annual allowance for AWS/CKA/ISTQB certifications, top-tier hardware, and AI development tools.</text>
        
        <rect x="18" y="180" width="228" height="32" rx="4" fill="#122744" />
        <text x="28" y="200" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">✓ Certs &amp; Tools Covered</text>
      </g>
    </g>

    <!-- Bottom Open Roles Ticker Strip -->
    <g transform="translate(24, 332)">
      <rect width="816" height="112" rx="8" fill="#071222" stroke="#152e4e" />
      <text x="20" y="24" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" letter-spacing="1">ACTIVE ENGINEERING TRACKS</text>

      <g transform="translate(20, 44)">
        <g transform="translate(0, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Mobile Engineers</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Flutter / Swift / Kotlin</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">4+ Years Exp</text>
        </g>
        <g transform="translate(200, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">QA Automation Leads</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Python, Java, TS, Appium</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">4+ Years Exp</text>
        </g>
        <g transform="translate(410, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Full-Stack &amp; Desktop</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Next.js 15, Tauri, .NET 8</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">3+ Years Exp</text>
        </g>
        <g transform="translate(620, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">DevOps Architects</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">AWS, Kubernetes, Terraform</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">5+ Years Exp</text>
        </g>
      </g>
    </g>
  </g>
</svg>

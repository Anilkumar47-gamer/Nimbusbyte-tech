<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style type="text/css"><![CDATA[
      @keyframes svgFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes svgFloatAlt {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(0.4deg); }
      }
      @keyframes svgPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes svgGlow {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.1); }
      }
      @keyframes svgBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes svgDashFlow {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
      .svg-anim-glow { animation: svgGlow 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .svg-anim-float { animation: svgFloat 6s ease-in-out infinite; }
      .svg-anim-float-delayed { animation: svgFloatAlt 7s ease-in-out -3.5s infinite; }
      .svg-anim-pulse { animation: svgPulse 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .svg-anim-blink { animation: svgBlink 2.2s ease-in-out infinite; }
      .svg-anim-dash { stroke-dasharray: 6 4; animation: svgDashFlow 12s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        *, .svg-anim-glow, .svg-anim-float, .svg-anim-float-delayed, .svg-anim-pulse, .svg-anim-blink, .svg-anim-dash {
          animation: none !important;
        }
      }
    ]]></style>
    <linearGradient id="sreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040e1c" />
      <stop offset="50%" stop-color="#08172e" />
      <stop offset="100%" stop-color="#0d2446" />
    </linearGradient>
    <linearGradient id="sreMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7c4" />
      <stop offset="100%" stop-color="#3fa9f5" />
    </linearGradient>
    <filter id="sreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#sreBg)" />

  <circle cx="260" cy="180" r="160" fill="#3fa9f5" opacity="0.14" filter="url(#sreGlow)" class="svg-anim-glow" />
  <circle cx="740" cy="340" r="170" fill="#6ee7c4" opacity="0.11" filter="url(#sreGlow)" class="svg-anim-glow" />

  <g transform="translate(48, 36)">
    <rect width="864" height="468" rx="14" fill="#081426" stroke="#1d3d6a" stroke-width="1.6" fill-opacity="0.95" />

    <!-- Top Bar -->
    <g transform="translate(24, 20)">
      <text y="16" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">SERVICE 07 — MANAGED IT SUPPORT &amp; 24/7 DEVOPS</text>
      <text y="42" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">24/7 SLA Telemetry · Auto-Healing Kubernetes · Priority Escalation</text>
    </g>

    <!-- Content -->
    <g transform="translate(24, 76)">
      <!-- Left: Grafana / Prometheus Real-Time Monitor Frame -->
      <g transform="translate(0, 0)">
        <rect width="360" height="348" rx="10" fill="#06101e" stroke="#162e50" />
        <text x="16" y="24" fill="#6ee7c4" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">PROMETHEUS &amp; GRAFANA TELEMETRY</text>
        
        <!-- Live Cluster Health -->
        <g transform="translate(16, 40)">
          <rect width="328" height="60" rx="6" fill="#0c1b33" stroke="#1c3b64" />
          <text x="14" y="22" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10">Global Cluster Uptime SLA</text>
          <text x="14" y="46" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">99.998% UPTIME</text>
          <text x="210" y="46" fill="#3fa9f5" font-family="'Inter', sans-serif" font-size="10">0 Active Alerts</text>
        </g>

        <!-- Dynamic Graph -->
        <g transform="translate(16, 112)">
          <rect width="328" height="120" rx="6" fill="#040b16" stroke="#12253e" />
          <path d="M 10 75 Q 50 30, 90 60 T 170 35 T 250 50 T 318 25" fill="none" stroke="url(#sreMint)" stroke-width="2.2" />
          <path d="M 10 75 Q 50 30, 90 60 T 170 35 T 250 50 T 318 25 L 318 110 L 10 110 Z" fill="url(#sreMint)" opacity="0.1" />
          <line x1="10" y1="45" x2="318" y2="45" stroke="#12253e" stroke-dasharray="2 3" />
          <line x1="10" y1="80" x2="318" y2="80" stroke="#12253e" stroke-dasharray="2 3" />
        </g>

        <!-- SRE Status Ticker -->
        <g transform="translate(16, 244)">
          <rect width="328" height="84" rx="6" fill="#0c231c" stroke="#10b981" />
          <text x="12" y="22" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">24/7 SRE ON-CALL ACTIVE</text>
          <text x="12" y="42" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9.5">Automated snapshots &amp; recovery verified daily</text>
          <text x="12" y="62" fill="#7cc4f8" font-family="'JetBrains Mono', monospace" font-size="9">Mean Time to Resolution (MTTR): &lt; 15 min</text>
        </g>
      </g>

      <!-- Right: Service Deliverables -->
      <g transform="translate(380, 0)">
        <rect width="436" height="348" rx="10" fill="#06101e" stroke="#162e50" />
        
        <g transform="translate(20, 20)">
          <text y="14" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">MANAGED DEVOPS PILLARS</text>
          
          <g transform="translate(0, 34)" font-family="'Inter', sans-serif" font-size="11">
            <text y="14" fill="#ffffff" font-weight="600">1. Round-the-Clock Telemetry &amp; Alerts</text>
            <text y="30" fill="#93a8c6">Continuous metrics monitoring with instant alerts dispatched to senior engineers.</text>

            <text y="62" fill="#ffffff" font-weight="600">2. Guaranteed Contractual SLAs</text>
            <text y="78" fill="#93a8c6">Contract-backed response times for critical incidents with transparent escalation.</text>

            <text y="110" fill="#ffffff" font-weight="600">3. Automated Disaster Recovery Drills</text>
            <text y="126" fill="#93a8c6">Regular restore simulations prove that backups work when disaster strikes.</text>

            <text y="158" fill="#ffffff" font-weight="600">4. Zero-Downtime Patching &amp; SRE Support</text>
            <text y="174" fill="#93a8c6">Rolling dependency updates and security patches during low-traffic windows.</text>
          </g>

          <!-- Badges -->
          <g transform="translate(0, 240)">
            <rect width="90" height="24" rx="4" fill="#112744" />
            <text x="45" y="16" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">24/7 On-Call</text>

            <rect x="98" width="90" height="24" rx="4" fill="#112744" />
            <text x="143" y="16" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">PagerDuty</text>

            <rect x="196" width="90" height="24" rx="4" fill="#112744" />
            <text x="241" y="16" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">Prometheus</text>

            <rect x="294" width="100" height="24" rx="4" fill="#112744" />
            <text x="344" y="16" text-anchor="middle" fill="#6ee7c4" font-family="'Inter', sans-serif" font-size="10">99.99% SLA</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>

          <text x="12" y="52" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="9">Automatic Failover Health</text>
          <text x="12" y="68" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="8.5">● STANDBY READY</text>
        </g>

        <!-- EKS Cluster 2 -->
        <g transform="translate(200, 48)">
          <rect width="182" height="80" rx="6" fill="#0d1f38" stroke="#1f4474" />
          <text x="12" y="20" fill="#3fa9f5" font-family="'Inter', sans-serif" font-size="10.5" font-weight="bold">Kubernetes Secondary</text>
          <text x="12" y="36" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="9">Disaster Recovery Warm</text>
          <text x="12" y="52" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="9">Horizontal Elasticity</text>
          <text x="12" y="68" fill="#3fa9f5" font-family="'JetBrains Mono', monospace" font-size="8.5">● 16 WORKERS READY</text>
        </g>


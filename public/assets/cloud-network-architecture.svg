            <text x="45" y="14" text-anchor="middle" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="9">Active-Sync</text>
            <rect x="98" width="110" height="20" rx="4" fill="#142c4c" />
            <text x="153" y="14" text-anchor="middle" fill="#7cc4f8" font-family="'JetBrains Mono', monospace" font-size="9">Zero Data Loss</text>
          </g>

      <g transform="translate(416, 0)">
        <rect width="400" height="240" rx="10" fill="#081426" stroke="#1a355a" stroke-width="1.2" />
        <rect x="14" y="12" width="144" height="22" rx="4" fill="#122a4a" />
        <text x="86" y="27" text-anchor="middle" fill="#6ee7c4" font-family="'Space Grotesk', sans-serif" font-size="10.5" font-weight="bold">AWS EU-CENTRAL-1 (Failover)</text>


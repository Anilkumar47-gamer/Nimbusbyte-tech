          <text x="14" y="22" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">Amazon Aurora PostgreSQL (Cross-Region Read Replica)</text>
          <text x="14" y="40" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="9.5">Global Database Cluster · Sub-1s Global Lag · Instant Promotion Disaster Recovery</text>
          

    <g transform="translate(24, 334)">
      <rect width="816" height="110" rx="8" fill="#071222" stroke="#162e4e" />
      <text x="20" y="24" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" letter-spacing="1">PROVEN CLOUD OUTCOMES</text>

      <g transform="translate(20, 42)">
        <g transform="translate(0, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">41% Cost Reduction</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">FinOps reserved instance audits</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ -$14,200/mo saved</text>
        </g>
        <g transform="translate(200, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">99.99% Verified Uptime</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Multi-AZ automated failover</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ 0 unplanned outages</text>
        </g>
        <g transform="translate(410, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Terraform 100% IaC</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Immutable cloud declarative code</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ Rebuild cluster in 8 min</text>
        </g>
        <g transform="translate(620, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Zero-Downtime Migration</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Live database replication</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ Cutover with 0s lag</text>
        </g>
      </g>

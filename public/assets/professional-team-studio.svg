      <!-- Member / Role 4 -->
      <g transform="translate(618, 0)">
        <rect width="198" height="230" rx="10" fill="#091526" stroke="#1c375c" />
        <circle cx="99" cy="50" r="28" fill="url(#avatarG4)" />
        <text x="99" y="56" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold">FS</text>
        
        <text x="99" y="100" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Full-Stack &amp; Desktop</text>
        <text x="99" y="118" text-anchor="middle" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Software Engineering Lead</text>

        <rect x="18" y="136" width="162" height="24" rx="4" fill="#132742" />
        <text x="99" y="152" text-anchor="middle" fill="#fcd34d" font-family="'Inter', sans-serif" font-size="10">Next.js / Tauri / .NET</text>

        <g transform="translate(18, 172)" font-family="'Inter', sans-serif" font-size="10" fill="#93a8c6">
          <text y="0">Modern Web &amp; Desktop C++</text>
          <text y="16">Microservices &amp; SQLite</text>
          <text y="32" fill="#6ee7c4">✓ Enterprise Portals</text>
        </g>
      </g>
    </g>

    <!-- Engineering Delivery Standards Bar -->
    <g transform="translate(24, 328)">
      <rect width="816" height="106" rx="8" fill="#071324" stroke="#173152" />
      <text x="20" y="24" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" letter-spacing="1">TEAM DELIVERY GUARANTEES</text>

      <g transform="translate(20, 42)">
        <g transform="translate(0, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Senior Hands Only</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">No junior bait-and-switch</text>
        </g>
        <g transform="translate(190, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Rigorous Automated QA</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Automated test suites in CI</text>
        </g>
        <g transform="translate(390, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Full Source Ownership</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Clean docs, no vendor lock-in</text>
        </g>
        <g transform="translate(590, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">24/7 SLA Backing</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Direct incident escalation</text>
        </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style type="text/css"><![CDATA[
      @keyframes svgFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes svgFloatAlt {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(0.4deg); }
      }
      @keyframes svgPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes svgGlow {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.1); }
      }
      @keyframes svgBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes svgDashFlow {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
      .svg-anim-glow { animation: svgGlow 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .svg-anim-float { animation: svgFloat 6s ease-in-out infinite; }
      .svg-anim-float-delayed { animation: svgFloatAlt 7s ease-in-out -3.5s infinite; }
      .svg-anim-pulse { animation: svgPulse 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .svg-anim-blink { animation: svgBlink 2.2s ease-in-out infinite; }
      .svg-anim-dash { stroke-dasharray: 6 4; animation: svgDashFlow 12s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        *, .svg-anim-glow, .svg-anim-float, .svg-anim-float-delayed, .svg-anim-pulse, .svg-anim-blink, .svg-anim-dash {
          animation: none !important;
        }
      }
    ]]></style>
    <linearGradient id="webSrvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040e1c" />
      <stop offset="50%" stop-color="#081830" />
      <stop offset="100%" stop-color="#0d2448" />
    </linearGradient>
    <linearGradient id="webGradS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7c4" />
      <stop offset="100%" stop-color="#3fa9f5" />
    </linearGradient>
    <filter id="webSrvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#webSrvBg)" />

  <circle cx="260" cy="180" r="160" fill="#3fa9f5" opacity="0.14" filter="url(#webSrvGlow)" class="svg-anim-glow" />
  <circle cx="740" cy="340" r="170" fill="#6ee7c4" opacity="0.11" filter="url(#webSrvGlow)" class="svg-anim-glow" />

  <g transform="translate(48, 36)">
    <rect width="864" height="468" rx="14" fill="#081426" stroke="#1d3d6a" stroke-width="1.6" fill-opacity="0.95" />

    <!-- Top Bar -->
    <g transform="translate(24, 20)">
      <text y="16" fill="#6ee7c4" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">SERVICE 02 — ENTERPRISE FULL-STACK WEB APPLICATIONS</text>
      <text y="42" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">Next.js 15 SSR · Python FastAPI · PostgreSQL Multi-Tenant SaaS</text>
    </g>

    <!-- Main Content -->
    <g transform="translate(24, 76)">
      <!-- Left: SaaS Dashboard Window -->
      <g transform="translate(0, 0)">
        <rect width="360" height="348" rx="10" fill="#06101e" stroke="#162e50" />
        
        <!-- Window Bar -->
        <rect width="360" height="34" rx="10" fill="#0b1a2e" />
        <circle cx="18" cy="17" r="4.5" fill="#ef4444" />
        <circle cx="32" cy="17" r="4.5" fill="#f59e0b" />
        <circle cx="46" cy="17" r="4.5" fill="#10b981" />
        <text x="64" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">https://app.enterprise-saas.io</text>

        <!-- KPI Metrics Grid -->
        <g transform="translate(16, 48)">
          <rect width="156" height="54" rx="6" fill="#0d1f38" stroke="#1c4270" />
          <text x="10" y="18" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="9">Active Cloud Tenants</text>
          <text x="10" y="40" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold">1,480 SaaS</text>

          <rect x="170" width="156" height="54" rx="6" fill="#0d1f38" stroke="#1c4270" />
          <text x="180" y="18" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="9">API Microservice RPS</text>
          <text x="180" y="40" fill="#6ee7c4" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold">18,200/s</text>
        </g>

        <!-- Waveform Chart inside Dashboard -->
        <g transform="translate(16, 114)">
          <rect width="326" height="116" rx="6" fill="#040c18" stroke="#122744" />
          <path d="M 10 75 Q 50 25, 90 60 T 170 30 T 250 55 T 316 20" fill="none" stroke="url(#webGradS)" stroke-width="2.2" />
          <path d="M 10 75 Q 50 25, 90 60 T 170 30 T 250 55 T 316 20 L 316 106 L 10 106 Z" fill="url(#webGradS)" opacity="0.1" />
          <line x1="10" y1="45" x2="316" y2="45" stroke="#122744" stroke-dasharray="2 3" />
          <line x1="10" y1="75" x2="316" y2="75" stroke="#122744" stroke-dasharray="2 3" />
        </g>

        <!-- Live WebSockets Ticker -->
        <g transform="translate(16, 242)">
          <rect width="326" height="88" rx="6" fill="#0c1f36" stroke="#1a4270" />
          <text x="12" y="22" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold">● LIVE WEBSOCKET DATA STREAM</text>
          <text x="12" y="42" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Edge-Rendered SSR with 0.08s TTFB Latency</text>
          <text x="12" y="62" fill="#7cc4f8" font-family="'JetBrains Mono', monospace" font-size="9">PostgreSQL Multi-AZ + Redis Cache Layer Active</text>
        </g>
      </g>

      <!-- Right: Web Deliverables -->
      <g transform="translate(380, 0)">
        <rect width="436" height="348" rx="10" fill="#06101e" stroke="#162e50" />
        
        <g transform="translate(20, 20)">
          <text y="14" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">MODERN FULL-STACK WEB PILLARS</text>
          
          <g transform="translate(0, 34)" font-family="'Inter', sans-serif" font-size="11">
            <text y="14" fill="#ffffff" font-weight="600">1. Edge SSR &amp; Next.js 15 App Router</text>
            <text y="30" fill="#93a8c6">Server-rendered components deliver blazing speed and SEO dominance.</text>

            <text y="62" fill="#ffffff" font-weight="600">2. Asynchronous Python FastAPI &amp; Node.js</text>
            <text y="78" fill="#93a8c6">Decoupled microservice architecture designed for zero-downtime rolling deploys.</text>

            <text y="110" fill="#ffffff" font-weight="600">3. Multi-Tenant Role-Based Access Control</text>
            <text y="126" fill="#93a8c6">Enterprise RBAC permissions, billing webhooks, and audit logging.</text>

            <text y="158" fill="#ffffff" font-weight="600">4. High-Performance PostgreSQL &amp; Redis</text>
            <text y="174" fill="#93a8c6">Multi-AZ replication, connection pooling, and sub-10ms cache hit rates.</text>
          </g>

          <!-- Badges -->
          <g transform="translate(0, 240)">
            <rect width="85" height="24" rx="4" fill="#112744" />
            <text x="42" y="16" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">Next.js 15</text>

            <rect x="93" width="75" height="24" rx="4" fill="#112744" />
            <text x="130" y="16" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">React 19</text>

            <rect x="176" width="95" height="24" rx="4" fill="#112744" />
            <text x="223" y="16" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">TypeScript</text>

            <rect x="279" width="105" height="24" rx="4" fill="#112744" />
            <text x="331" y="16" text-anchor="middle" fill="#6ee7c4" font-family="'Inter', sans-serif" font-size="10">PostgreSQL</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>

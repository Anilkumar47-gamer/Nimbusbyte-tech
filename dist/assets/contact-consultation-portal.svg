<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style type="text/css"><![CDATA[
      @keyframes svgFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes svgFloatAlt {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(0.4deg); }
      }
      @keyframes svgPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes svgGlow {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.1); }
      }
      @keyframes svgBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes svgDashFlow {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
      .svg-anim-glow { animation: svgGlow 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .svg-anim-float { animation: svgFloat 6s ease-in-out infinite; }
      .svg-anim-float-delayed { animation: svgFloatAlt 7s ease-in-out -3.5s infinite; }
      .svg-anim-pulse { animation: svgPulse 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .svg-anim-blink { animation: svgBlink 2.2s ease-in-out infinite; }
      .svg-anim-dash { stroke-dasharray: 6 4; animation: svgDashFlow 12s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        *, .svg-anim-glow, .svg-anim-float, .svg-anim-float-delayed, .svg-anim-pulse, .svg-anim-blink, .svg-anim-dash {
          animation: none !important;
        }
      }
    ]]></style>
    <linearGradient id="cntBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e1c" />
      <stop offset="50%" stop-color="#09172e" />
      <stop offset="100%" stop-color="#0d2448" />
    </linearGradient>
    <linearGradient id="cntMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fa9f5" />
      <stop offset="100%" stop-color="#6ee7c4" />
    </linearGradient>
    <filter id="cntGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#cntBg)" />

  <circle cx="280" cy="180" r="160" fill="#3fa9f5" opacity="0.14" filter="url(#cntGlow)" class="svg-anim-glow" />
  <circle cx="720" cy="340" r="170" fill="#6ee7c4" opacity="0.11" filter="url(#cntGlow)" class="svg-anim-glow" />

  <g transform="translate(48, 36)">
    <rect width="864" height="468" rx="14" fill="#081426" stroke="#1d3d6a" stroke-width="1.6" fill-opacity="0.95" />

    <!-- Top Bar -->
    <g transform="translate(24, 20)">
      <text y="16" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">DIRECT TECHNICAL CONSULTATION PORTAL</text>
      <text y="42" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">Connect with Senior Systems Architects &amp; QA Leads · Guaranteed &lt; 24h SLA</text>
    </g>

    <!-- 3 Consultation Pillars -->
    <g transform="translate(24, 76)">
      <!-- Box 1: Architecture Review -->
      <g transform="translate(0, 0)">
        <rect width="260" height="236" rx="10" fill="#0c1b33" stroke="#1c385c" />
        <circle cx="36" cy="36" r="16" fill="#3fa9f5" opacity="0.15" class="svg-anim-glow" />
        <text x="36" y="42" text-anchor="middle" fill="#3fa9f5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">01</text>
        <text x="18" y="80" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">Direct Architect Call</text>
        <text x="18" y="104" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="11">No sales triage or account reps. You speak directly with our senior cloud, mobile, and QA leads.</text>
        
        <rect x="18" y="180" width="224" height="32" rx="4" fill="#122744" />
        <text x="28" y="200" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ Senior Engineers Only</text>
      </g>

      <!-- Box 2: Mutual NDA & IP Protection -->
      <g transform="translate(276, 0)">
        <rect width="260" height="236" rx="10" fill="#0c1b33" stroke="#1c385c" />
        <circle cx="36" cy="36" r="16" fill="#6ee7c4" opacity="0.15" class="svg-anim-glow" />
        <text x="36" y="42" text-anchor="middle" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">02</text>
        <text x="18" y="80" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">Mutual NDA Protection</text>
        <text x="18" y="104" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="11">We execute mutual non-disclosure agreements before reviewing any sensitive codebase or architecture.</text>
        
        <rect x="18" y="180" width="224" height="32" rx="4" fill="#122744" />
        <text x="28" y="200" fill="#7cc4f8" font-family="'JetBrains Mono', monospace" font-size="10">✓ 100% Confidentiality</text>
      </g>

      <!-- Box 3: Actionable Roadmap & Quote -->
      <g transform="translate(552, 0)">
        <rect width="264" height="236" rx="10" fill="#0c1b33" stroke="#1c385c" />
        <circle cx="36" cy="36" r="16" fill="#a855f7" opacity="0.15" class="svg-anim-glow" />
        <text x="36" y="42" text-anchor="middle" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">03</text>
        <text x="18" y="80" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">Detailed Scope &amp; Quote</text>
        <text x="18" y="104" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="11">Receive an actionable architecture recommendation, timeline milestones, and fixed team proposal.</text>
        
        <rect x="18" y="180" width="228" height="32" rx="4" fill="#122744" />
        <text x="28" y="200" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">✓ 24-Hour Reply SLA</text>
      </g>
    </g>

    <!-- Bottom Channels Strip -->
    <g transform="translate(24, 332)">
      <rect width="816" height="112" rx="8" fill="#071222" stroke="#152e4e" />
      <text x="20" y="24" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" letter-spacing="1">DIRECT RESPONSE CHANNELS</text>

      <g transform="translate(20, 44)">
        <g transform="translate(0, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Email Support</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">support@nimbusbyte.com</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">&lt; 24h Guaranteed</text>
        </g>
        <g transform="translate(200, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Engineering Hotline</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">+91 9169681462 (Mon–Fri)</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">Direct Architect Access</text>
        </g>
        <g transform="translate(410, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Studio Headquarters</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Sector 62, Noida, India</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">Visits by Appointment</text>
        </g>
        <g transform="translate(620, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">24/7 Client Retainer</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Dedicated SLA Triage</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">Instant Escalation</text>
        </g>
      </g>
    </g>
  </g>
</svg>

      <rect width="150" height="66" rx="8" fill="#0e213b" stroke="#1c3b64" />
      <text x="14" y="20" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10">App Cold Launch</text>
      <text x="14" y="44" fill="#6ee7c4" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">0.4 sec</text>
      <text x="14" y="58" fill="#93a8c6" font-family="'JetBrains Mono', monospace" font-size="8.5">vs 4.2s legacy</text>

      <rect x="160" width="150" height="66" rx="8" fill="#0e213b" stroke="#1c3b64" />
      <text x="174" y="20" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10">Offline Sync Loss</text>
      <text x="174" y="44" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">0.00%</text>
      <text x="174" y="58" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="8.5">SQLite Queue</text>

      <rect x="320" width="160" height="66" rx="8" fill="#0e213b" stroke="#1c3b64" />
      <text x="334" y="20" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10">App Store Rating</text>
      <text x="334" y="44" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">4.9 ★★★★★</text>
      <text x="334" y="58" fill="#7cc4f8" font-family="'JetBrains Mono', monospace" font-size="8.5">14,200 Reviews</text>
    </g>

    <!-- Architecture & Features Box -->

    <text x="26" y="238" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="7.5">🔒 Face ID &amp; Biometrics</text>
    <text x="26" y="249" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="7">Offline SQLite Cipher Encrypted</text>
  </g>

  <!-- Right: Technical Architecture Specifications -->
  <g transform="translate(270, 78)">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#0c1d38" />
      <stop offset="100%" stop-color="#050c18" />
    </linearGradient>
    <linearGradient id="finCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fa9f5" />
      <stop offset="100%" stop-color="#6ee7c4" />
    </linearGradient>
    <filter id="finGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#finBg)" />

  <!-- Frame Canvas -->
  <rect x="30" y="24" width="740" height="402" rx="12" fill="#0a1628" stroke="#1c385c" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="30" y="24" width="740" height="38" rx="12" fill="#0e213a" />
  <circle cx="54" cy="43" r="4.5" fill="#ef4444" />
  <circle cx="70" cy="43" r="4.5" fill="#f59e0b" />
  <circle cx="86" cy="43" r="4.5" fill="#10b981" />
  <text x="110" y="47" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="11.5" font-weight="600">NimbusPay Mobile — Cross-Platform Flutter / SQLite WealthTech Engine</text>
  <rect x="650" y="34" width="105" height="18" rx="4" fill="#133156" />
  <text x="702" y="46" text-anchor="middle" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="9.5">60 FPS SYNC</text>

  <!-- Left: Mobile Device Mockup Inside Card -->
  <g transform="translate(60, 78)">
    <rect width="180" height="324" rx="24" fill="#050d18" stroke="#224778" stroke-width="2" />
    <!-- Dynamic Island -->
    <rect x="60" y="8" width="60" height="10" rx="5" fill="#02060c" />
    
    <!-- Screen -->
    <rect x="10" y="24" width="160" height="280" rx="16" fill="#09182d" />
    <text x="22" y="44" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">Portfolio Value</text>
    <text x="22" y="66" fill="#6ee7c4" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">$248,910.40</text>
    <text x="22" y="80" fill="#3fa9f5" font-family="'JetBrains Mono', monospace" font-size="8.5">▲ +18.4% · 60 FPS Render</text>

    <!-- Chart -->
    <path d="M 22 130 Q 45 95, 75 115 T 120 90 T 155 80" fill="none" stroke="url(#finCyan)" stroke-width="2.2" />
    <path d="M 22 130 Q 45 95, 75 115 T 120 90 T 155 80 L 155 145 L 22 145 Z" fill="url(#finCyan)" opacity="0.12" />

    <!-- Ledger Transaction Items -->
    <g transform="translate(18, 154)">
      <rect width="124" height="28" rx="4" fill="#0f223a" />
      <text x="8" y="14" fill="#eaf3fc" font-family="'Inter', sans-serif" font-size="8" font-weight="600">Stock Order AAPL</text>
      <text x="8" y="23" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="7.5">Filled · 0.04s</text>
      <text x="116" y="18" text-anchor="end" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">+$4,200</text>
    </g>

    <g transform="translate(18, 188)">
      <rect width="124" height="28" rx="4" fill="#0f223a" />
      <text x="8" y="14" fill="#eaf3fc" font-family="'Inter', sans-serif" font-size="8" font-weight="600">Index ETF VOO</text>
      <text x="8" y="23" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="7.5">Filled · 0.04s</text>
      <text x="116" y="18" text-anchor="end" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">+$8,900</text>
    </g>

    <!-- Security Chip -->

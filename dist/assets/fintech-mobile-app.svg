      <rect width="480" height="150" rx="8" fill="#081426" stroke="#162e50" />
      <text x="16" y="24" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">MOBILE SYSTEM HIGHLIGHTS</text>
      
      <g transform="translate(16, 42)" font-family="'Inter', sans-serif" font-size="11">
        <text y="14" fill="#eaf3fc">✓ Single Flutter codebase running natively on iOS &amp; Android</text>
        <text y="38" fill="#eaf3fc">✓ Real-time WebSockets streaming 5,000 market ticks per second</text>
        <text y="62" fill="#eaf3fc">✓ Biometric Keychain token encryption complying with financial laws</text>
        <text y="86" fill="#6ee7c4" font-weight="600">✓ Fastlane CI/CD pipeline deploying directly to TestFlight &amp; Play Store</text>
      </g>
    </g>

    <!-- Tech Chips -->
    <g transform="translate(0, 240)">
      <rect width="78" height="24" rx="4" fill="#132a48" />
      <text x="39" y="16" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">Flutter 3</text>

      <rect x="86" width="60" height="24" rx="4" fill="#132a48" />
      <text x="116" y="16" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">Dart</text>

      <rect x="154" width="88" height="24" rx="4" fill="#132a48" />
      <text x="198" y="16" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">WebSockets</text>

      <rect x="250" width="104" height="24" rx="4" fill="#132a48" />
      <text x="302" y="16" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">SQLite Cipher</text>

      <rect x="362" width="118" height="24" rx="4" fill="#132a48" />
      <text x="421" y="16" text-anchor="middle" fill="#6ee7c4" font-family="'Inter', sans-serif" font-size="10">Fastlane CI/CD</text>
    </g>

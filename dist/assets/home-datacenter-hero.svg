          <path d="M 10 80 Q 40 20, 80 65 T 150 30 T 220 70 T 280 25" fill="none" stroke="url(#neonGradient)" stroke-width="2.5" />
          <path d="M 10 80 Q 40 20, 80 65 T 150 30 T 220 70 T 280 25 L 280 110 L 10 110 Z" fill="url(#neonGradient)" opacity="0.1" />
          
          <line x1="10" y1="40" x2="280" y2="40" stroke="#142a4a" stroke-dasharray="3 3" />

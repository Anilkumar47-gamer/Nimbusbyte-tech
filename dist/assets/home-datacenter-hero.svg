          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">100% IP, code &amp; configs</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ Zero Vendor Lock-in</text>
        </g>
        <g transform="translate(620, 0)">
          <text y="14" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Enterprise SLA Backed</text>
          <text y="32" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10.5">Under 24h triage guarantee</text>
          <text y="48" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10">✓ 24/7 Priority Support</text>
        </g>

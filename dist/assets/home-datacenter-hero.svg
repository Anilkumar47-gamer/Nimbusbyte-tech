<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b17" />
      <stop offset="50%" stop-color="#08152b" />
      <stop offset="100%" stop-color="#0d2446" />
    </linearGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fa9f5" />
      <stop offset="100%" stop-color="#6ee7c4" />
    </linearGradient>
    <linearGradient id="cardGradHero" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#122744" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#081426" stop-opacity="0.98" />
    </linearGradient>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#heroBg)" />

  <!-- Circuit grid pattern -->
  <g stroke="#162e50" stroke-width="1" opacity="0.45">

            <rect x="14" y="74" width="178" height="18" rx="3" fill="#11294a" />
            <text x="22" y="87" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8.5">LATENCY: 12ms // 0% LOSS</text>

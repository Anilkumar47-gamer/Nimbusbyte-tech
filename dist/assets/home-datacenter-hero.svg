            <text x="14" y="44" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10">Tauri (Rust) · .NET · C++</text>
            <text x="14" y="62" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">&lt; 38MB RAM · Hardware I/O</text>

            <text x="14" y="24" fill="#6ee7c4" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">🌐 Web SaaS Platform</text>
            <text x="14" y="44" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10">Next.js 15 · Python · Node</text>
            <text x="14" y="62" fill="#3fa9f5" font-family="'JetBrains Mono', monospace" font-size="10">SSR Edge · Sub-Second</text>

      <text x="14" y="48" fill="#6ee7c4" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">0.00%</text>
      <text x="14" y="64" fill="#93a8c6" font-family="'JetBrains Mono', monospace" font-size="8.5">0 bugs in 6 months</text>

      <rect x="195" width="195" height="74" rx="8" fill="#0e213b" stroke="#1c3b64" />
      <text x="209" y="22" fill="#93a8c6" font-family="'Inter', sans-serif" font-size="10">CI Parallel Workers</text>
      <text x="209" y="48" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">12 Pods</text>
      <text x="209" y="64" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="8.5">GitHub Actions CI</text>
    </g>

    <!-- Narrative Box -->
    <g transform="translate(0, 88)">
      <rect width="390" height="150" rx="8" fill="#081426" stroke="#162e50" />
      <text x="16" y="24" fill="#3fa9f5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">ARCHITECTURE OUTCOMES</text>
      
      <g transform="translate(16, 42)" font-family="'Inter', sans-serif" font-size="11">
        <text y="14" fill="#eaf3fc">✓ Replaced brittle manual testing with automated CI gates</text>
        <text y="38" fill="#eaf3fc">✓ Multi-language frameworks matching backend developers</text>
        <text y="62" fill="#eaf3fc">✓ Parallel test execution running 1,800+ tests in under 12 min</text>
        <text y="86" fill="#6ee7c4" font-weight="600">✓ Enabled confident multiple-deploys-per-day velocity</text>
      </g>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 252)">
      <rect width="105" height="26" rx="4" fill="#132a48" />
      <text x="52" y="17" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">PyTest (Python)</text>

      <rect x="115" width="105" height="26" rx="4" fill="#132a48" />
      <text x="167" y="17" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">TestNG (Java)</text>

      <rect x="230" width="115" height="26" rx="4" fill="#132a48" />
      <text x="287" y="17" text-anchor="middle" fill="#7cc4f8" font-family="'Inter', sans-serif" font-size="10">Playwright (TS)</text>

      <rect x="355" width="35" height="26" rx="4" fill="#132a48" />
      <text x="372" y="17" text-anchor="middle" fill="#6ee7c4" font-family="'Inter', sans-serif" font-size="10">C#</text>
    </g>

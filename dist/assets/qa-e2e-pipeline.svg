      <stop offset="0%" stop-color="#07101f" />
      <stop offset="50%" stop-color="#0a182e" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <linearGradient id="neonMintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7c4" />
      <stop offset="100%" stop-color="#3fa9f5" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#qaE2eBg)" />

  <rect x="30" y="24" width="740" height="402" rx="12" fill="#091424" stroke="#1c385c" stroke-width="1.5" />
  
  <!-- Header -->

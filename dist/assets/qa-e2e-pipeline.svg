  <circle cx="70" cy="43" r="4.5" fill="#f59e0b" />
  <circle cx="86" cy="43" r="4.5" fill="#10b981" />
  <text x="110" y="47" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="11.5" font-weight="600">Omnichannel Test Matrix — Multi-Language CI/CD Pipeline Case Study</text>
  <rect x="640" y="34" width="115" height="18" rx="4" fill="#0f342c" />
  <text x="697" y="46" text-anchor="middle" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="9.5">12 MIN RUN</text>

  <!-- Left: CI Pipeline Execution Stages -->
  <g transform="translate(60, 78)">

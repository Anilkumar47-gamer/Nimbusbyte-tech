      <text x="32" y="32" fill="#93a8c6" font-family="'JetBrains Mono', monospace" font-size="8.5">RestAssured + PyTest · 512 tests (1.8s)</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(16, 92)">
      <rect width="248" height="44" rx="6" fill="#0c1a2f" stroke="#1a3d6a" />
      <circle cx="18" cy="22" r="6" fill="#6ee7c4" />
      <text x="32" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Stage 2: Cross-Browser E2E</text>
      <text x="32" y="32" fill="#93a8c6" font-family="'JetBrains Mono', monospace" font-size="8.5">Playwright TS · 819 tests (3.2s)</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(16, 144)">
      <rect width="248" height="44" rx="6" fill="#0c1a2f" stroke="#1a3d6a" />
      <circle cx="18" cy="22" r="6" fill="#6ee7c4" />
      <text x="32" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Stage 3: Mobile Device Farm</text>
      <text x="32" y="32" fill="#93a8c6" font-family="'JetBrains Mono', monospace" font-size="8.5">Appium iOS / Android · 342 tests (4.1s)</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(16, 196)">
      <rect width="248" height="44" rx="6" fill="#0c1a2f" stroke="#1a3d6a" />
      <circle cx="18" cy="22" r="6" fill="#6ee7c4" />
      <text x="32" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Stage 4: SOC 2 Compliance Hash</text>
      <text x="32" y="32" fill="#93a8c6" font-family="'JetBrains Mono', monospace" font-size="8.5">C# SpecFlow BDD · 190 tests (0.9s)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <style type="text/css"><![CDATA[
      @keyframes svgFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes svgFloatAlt {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(0.4deg); }
      }
      @keyframes svgPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes svgGlow {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50% { opacity: 0.28; transform: scale(1.1); }
      }
      @keyframes svgBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes svgDashFlow {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
      .svg-anim-glow { animation: svgGlow 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .svg-anim-float { animation: svgFloat 6s ease-in-out infinite; }
      .svg-anim-float-delayed { animation: svgFloatAlt 7s ease-in-out -3.5s infinite; }
      .svg-anim-pulse { animation: svgPulse 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .svg-anim-blink { animation: svgBlink 2.2s ease-in-out infinite; }
      .svg-anim-dash { stroke-dasharray: 6 4; animation: svgDashFlow 12s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        *, .svg-anim-glow, .svg-anim-float, .svg-anim-float-delayed, .svg-anim-pulse, .svg-anim-blink, .svg-anim-dash {
          animation: none !important;
        }
      }
    ]]></style>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071224" />
      <stop offset="60%" stop-color="#0b1b36" />
      <stop offset="100%" stop-color="#040a14" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7c4" />
      <stop offset="50%" stop-color="#3fa9f5" />
      <stop offset="100%" stop-color="#0e4fa8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(110, 231, 196, 0.25)" />
      <stop offset="100%" stop-color="rgba(63, 169, 245, 0.02)" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#shieldBg)" />

  <!-- Security Constellation Network Lines -->
  <g stroke="#183259" stroke-width="1" opacity="0.6">
    <line x1="120" y1="120" x2="280" y2="160" />
    <line x1="280" y1="160" x2="200" y2="300" />
    <line x1="200" y1="300" x2="120" y2="120" />
    <line x1="520" y1="160" x2="680" y2="120" />
    <line x1="680" y1="120" x2="600" y2="300" />
    <line x1="600" y1="300" x2="520" y2="160" />
    <circle cx="120" cy="120" r="4" fill="#3fa9f5" class="svg-anim-blink" />
    <circle cx="280" cy="160" r="4" fill="#6ee7c4" class="svg-anim-blink" />
    <circle cx="200" cy="300" r="4" fill="#3fa9f5" class="svg-anim-blink" />
    <circle cx="680" cy="120" r="4" fill="#3fa9f5" class="svg-anim-blink" />
    <circle cx="520" cy="160" r="4" fill="#6ee7c4" class="svg-anim-blink" />
    <circle cx="600" cy="300" r="4" fill="#3fa9f5" class="svg-anim-blink" />
  </g>

  <!-- Central Emblem / Shield -->
  <g transform="translate(400, 205)">
    <!-- Outer Aura -->
    <path d="M 0 -130 L 110 -65 L 110 50 C 110 120, 0 160, 0 160 C 0 160, -110 120, -110 50 L -110 -65 Z" fill="url(#glowGrad)" stroke="#22477a" stroke-width="1.5" />
    <!-- Core Shield -->
    <path d="M 0 -110 L 90 -55 L 90 40 C 90 100, 0 135, 0 135 C 0 135, -90 100, -90 40 L -90 -55 Z" fill="#091830" stroke="url(#shieldGrad)" stroke-width="2.5" />
    
    <!-- Lock & Audit Checkmark -->
    <circle cx="0" cy="-15" r="28" fill="#122a4f" stroke="#6ee7c4" stroke-width="2" />
    <path d="M -12 -15 L -3 -6 L 14 -23" fill="none" stroke="#6ee7c4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="0" y="45" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SOC 2 TYPE II</text>
    <text x="0" y="65" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">100% COMPLIANT</text>
  </g>

  <!-- Left Floating Security Node Card -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="200" height="110" rx="8" fill="#0c1d38" stroke="#1d3f70" stroke-width="1.2" />
    <text x="14" y="24" fill="#3fa9f5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">&gt; ZERO-TRUST IAM</text>
    <text x="14" y="46" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Least-Privilege Roles</text>
    <text x="14" y="68" fill="#93a8c6" font-family="system-ui, sans-serif" font-size="10">Ephemeral token rotation &amp; Vault secrets</text>
    <rect x="14" y="80" width="85" height="18" rx="4" fill="#13315a" />
    <text x="22" y="93" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="9">✓ ENFORCED</text>
  </g>

  <!-- Right Floating Audit Trail Card -->
  <g transform="translate(540, 160)">
    <rect x="0" y="0" width="200" height="110" rx="8" fill="#0c1d38" stroke="#1d3f70" stroke-width="1.2" />
    <text x="14" y="24" fill="#6ee7c4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">&gt; AUDIT EVIDENCE</text>
    <text x="14" y="46" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Continuous SIEM Trail</text>
    <text x="14" y="68" fill="#93a8c6" font-family="system-ui, sans-serif" font-size="10">Cryptographic hashes &amp; AWS KMS envelope</text>
    <rect x="14" y="80" width="95" height="18" rx="4" fill="#13315a" />
    <text x="22" y="93" fill="#3fa9f5" font-family="'JetBrains Mono', monospace" font-size="9">✓ AUDITOR READY</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(230, 385)">
    <rect x="0" y="0" width="100" height="26" rx="6" fill="#112747" stroke="#254a7c" stroke-width="1" />
    <text x="50" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ISO 27001</text>

    <rect x="120" y="0" width="100" height="26" rx="6" fill="#112747" stroke="#254a7c" stroke-width="1" />
    <text x="170" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">HIPAA Ready</text>

    <rect x="240" y="0" width="100" height="26" rx="6" fill="#112747" stroke="#254a7c" stroke-width="1" />
    <text x="290" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">GDPR Validated</text>
  </g>
</svg>
